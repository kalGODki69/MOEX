<app-header [title]="(title$ | async) || 'MOEX / Индексы'"></app-header>

<div class="table-container">
  <app-shares-table
    [data]="(indices$ | async) ?? []"
    (rowClick)="navigateToInstrument($event)"
  ></app-shares-table>

  @if ((indices$ | async) === null) {
    <div class="loading">Загрузка...</div>
  }
</div>
