<app-header [title]="(title$ | async) || 'MOEX / Акции'"></app-header>

<div class="table-container">
  <app-shares-table
    [data]="(shares$ | async) ?? []"
    (rowClick)="navigateToInstrument($event)"
  ></app-shares-table>

  @if ((shares$ | async) === null) {
    <div class="loading">Загрузка...</div>
  }
</div>
